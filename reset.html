<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polyverba Password Reset</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
      background: #081426;
      color: white;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 18px 30px;
      background: #18b7ff;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
    }

    #status {
      margin-top: 25px;
      font-size: 14px;
      color: #bbbbbb;
    }
  </style>
</head>

<body>

  <h1>Polyverba</h1>

  <h2>Password Reset</h2>

  <p>Your password reset request has been verified.</p>

  <p>Tap below to continue in Polyverba.</p>

  <a id="openApp"
     class="button"
     href="polyverba://reset-password">
    Open Polyverba
  </a>

  <p id="status">Preparing secure recovery link...</p>

  <script>
    const query = window.location.search || "";
    const hash = window.location.hash || "";

    const appUrl =
      "polyverba://reset-password" + query + hash;

    document.getElementById("openApp")
      .setAttribute("href", appUrl);

    document.getElementById("status").textContent =
      (query || hash)
        ? "Recovery information received."
        : "No recovery information was received.";
  </script>

</body>
</html>
