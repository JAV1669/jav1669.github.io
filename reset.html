<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polyverba Password Reset</title>
</head>

<body>
  <h1>Polyverba Password Reset</h1>

  <p>Your password reset request is ready.</p>

  <button
    style="font-size:22px; padding:20px;"
    onclick="openPolyverba()">
    Open Polyverba
  </button>

  <p>Callback page loaded successfully.</p>

  <script>
    function openPolyverba() {
      const query = window.location.search || "";
      const hash = window.location.hash || "";

      window.location.href =
        "polyverba://reset-password" + query + hash;
    }
  </script>
</body>
</html>
